# Render Blueprint — SafeLife-Atlas
# 백엔드(FastAPI/uvicorn) + 프론트(Vite 정적)를 한 번에 배포한다.
services:
  # 1) 백엔드 API — FastAPI (requirements.txt는 루트, 실행은 backend/)
  - type: web
    name: safelife-atlas-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # 자료실 DB (slice 1). 무료 Postgres는 워크스페이스당 1개·blueprint 제약이 있어
      # Render 대시보드에서 수동 생성(New > Postgres, Free, region=singapore) 후,
      # 이 서비스 Environment에 Internal Database URL을 DATABASE_URL로 붙여넣는다.
      # 설정 전까지 백엔드는 seed JSON으로 폴백하므로 공개 화면은 안 깨진다.
      - key: DATABASE_URL
        sync: false

  # 2) 프론트엔드 — Vite 빌드 → 정적 호스팅 (전역 CDN, 무료)
  - type: web
    name: safelife-atlas-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Vite가 빌드 시점에 이 값을 번들에 인라인한다 (import.meta.env.VITE_API_BASE_URL).
      # 백엔드 서비스의 공개 URL을 고정 지정한다.
      - key: VITE_API_BASE_URL
        value: https://safelife-atlas-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
